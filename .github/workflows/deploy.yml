name: Deploy Pelican Blog (Surya)

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pelican markdown jinja2 MarkupSafe feedgenerator python-dateutil "feedparser>=6.0.0" beautifulsoup4 typogrify pygments unidecode

      - name: Build site with Pelican
        run: pelican content -s publishconf.py

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via rsync
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" output/ deployer@${{ secrets.SERVER_IP }}:/srv/nyayapati/webroot/surya/
