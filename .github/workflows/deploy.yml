name: Deploy Pelican Blog (Surya)

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pelican markdown jinja2 MarkupSafe feedgenerator python-dateutil "feedparser>=6.0.0" beautifulsoup4 typogrify pygments unidecode

      - name: Build site with Pelican
        run: pelican content -s publishconf.py

      - name: Deploy via rsync over SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          python3 -c '
          import os, base64
          key = os.environ.get("SERVER_SSH_KEY", "").strip()
          key_path = os.path.expanduser("~/.ssh/deploy_key")
          if "BEGIN" in key:
              lines = key.split()
              header = " ".join(lines[:4])
              footer = " ".join(lines[-4:])
              body = "\n".join(lines[4:-4])
              formatted = f"{header}\n{body}\n{footer}\n"
              with open(key_path, "w") as f:
                  f.write(formatted)
          else:
              with open(key_path, "wb") as f:
                  f.write(base64.b64decode(key))
          '
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" output/ deployer@"$SERVER_IP":/srv/nyayapati/webroot/surya/
          rm -f ~/.ssh/deploy_key
